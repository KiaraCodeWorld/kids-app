{% extends 'trainer/base.html' %}

{% block content %}
<div class="vocab-lesson-wrapper">
    <div class="vocab-header">
        <h2>{{ level }} Vocabulary Lesson</h2>
        <div class="level-badge">{{ level }}</div>
    </div>

    <div class="vocab-progress">
        <p class="progress-text">Word <span id="wordNum">1</span> of <span id="wordTotal">{{ word_count }}</span></p>
    </div>

    <div class="vocab-content">
        <div class="word-card">
            <div class="word-main">
                <div class="word-title-row">
                    <h3 id="wordDisplay" class="word-big">Word</h3>
                    <button id="pronounceBtn" class="pronounce-btn" title="Hear pronunciation">🔊 Pronounce</button>
                </div>
                <p id="definitionDisplay" class="definition-text">Loading...</p>
            </div>

            <div class="usage-section">
                <h4>📖 Real-Life Usage:</h4>
                <p id="usageDisplay" class="usage-text">Loading...</p>
            </div>

            <div class="explanation-section">
                <button id="explainBtn" class="explain-btn">💡 Get AI Explanation</button>
                <div id="explanationContent" class="explanation-content" style="display: none;">
                    <p id="explanationText">Loading detailed explanation...</p>
                </div>
            </div>

            <div class="save-section">
                <button id="saveBtn" class="save-btn">⭐ Save to My Words</button>
                <span id="saveStatus" class="save-status"></span>
            </div>
        </div>

        <div class="vocab-controls">
            <button id="prevBtn" class="button secondary">← Previous Word</button>
            <button id="nextBtn" class="button">Next Word →</button>
        </div>

        <a href="{% url 'trainer:vocabulary_home' %}" class="button secondary full-width">← Back to Levels</a>
    </div>
</div>

<script>
const words = JSON.parse('{{ words_json|escapejs }}');
let currentIndex = 0;

const wordDisplay = document.getElementById('wordDisplay');
const definitionDisplay = document.getElementById('definitionDisplay');
const usageDisplay = document.getElementById('usageDisplay');
const explanationContent = document.getElementById('explanationContent');
const explanationText = document.getElementById('explanationText');
const explainBtn = document.getElementById('explainBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const saveBtn = document.getElementById('saveBtn');
const saveStatus = document.getElementById('saveStatus');
const pronounceBtn = document.getElementById('pronounceBtn');

function getCurrentWord() {
    return words[currentIndex];
}

function displayWord() {
    const word = getCurrentWord();

    wordDisplay.textContent = word.word;
    definitionDisplay.textContent = word.definition;
    usageDisplay.textContent = `"${word.usage}"`;

    document.getElementById('wordNum').textContent = currentIndex + 1;
    document.getElementById('wordTotal').textContent = words.length;

    // Update button states
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === words.length - 1;

    // Reset explanation
    explanationContent.style.display = 'none';
    explainBtn.textContent = '💡 Get AI Explanation';
    explainBtn.dataset.loaded = 'false';
}


explainBtn.addEventListener('click', async function() {
    const word = getCurrentWord();

    if (this.dataset.loaded === 'true') {
        const isHidden = explanationContent.style.display === 'none';
        explanationContent.style.display = isHidden ? 'block' : 'none';
        this.textContent = isHidden ? '💡 Hide Explanation' : '💡 Show Explanation';
        return;
    }

    explanationText.innerHTML = 'Loading...';
    explanationContent.style.display = 'block';
    this.textContent = '💡 Hide Explanation';

    try {
        const response = await fetch(`/api/word-explanation/${word.word}/`);
        const data = await response.json();

        if (data.explanation) {
            explanationText.innerHTML = renderMarkdown(data.explanation);
        } else {
            explanationText.textContent = 'Unable to load explanation. Try a dictionary!';
        }

        this.dataset.loaded = 'true';
    } catch (error) {
        explanationText.textContent = `Try using "${word.word}" in a sentence today!`;
        this.dataset.loaded = 'true';
    }
});

pronounceBtn.addEventListener('click', function() {
    const word = getCurrentWord();
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word.word);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    pronounceBtn.disabled = true;
    utter.onend = () => { pronounceBtn.disabled = false; };
    utter.onerror = () => { pronounceBtn.disabled = false; };
    window.speechSynthesis.speak(utter);
});

prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
        currentIndex--;
        displayWord();
    }
});

nextBtn.addEventListener('click', () => {
    if (currentIndex < words.length - 1) {
        currentIndex++;
        displayWord();
    }
});

saveBtn.addEventListener('click', async function() {
    const word = getCurrentWord();

    try {
        const response = await fetch('/api/save-word/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                word: word.word,
                definition: word.definition,
                usage: word.usage,
                level: '{{ level }}'
            })
        });

        const data = await response.json();

        if (data.success) {
            saveStatus.textContent = '✓ Saved!';
            saveStatus.style.color = '#10b981';
            saveBtn.textContent = '⭐ Saved to My Words';
            saveBtn.disabled = true;

            setTimeout(() => {
                saveStatus.textContent = '';
            }, 3000);
        }
    } catch (error) {
        saveStatus.textContent = '✗ Save failed';
        saveStatus.style.color = '#ef4444';
    }
});

async function checkIfSaved() {
    const word = getCurrentWord();
    try {
        const response = await fetch(`/api/check-saved-word/${word.word}/`);
        const data = await response.json();

        if (data.is_saved) {
            saveBtn.textContent = '⭐ Already Saved';
            saveBtn.disabled = true;
            saveBtn.style.opacity = '0.6';
        } else {
            saveBtn.textContent = '⭐ Save to My Words';
            saveBtn.disabled = false;
            saveBtn.style.opacity = '1';
            saveStatus.textContent = '';
        }
    } catch (error) {
        // Ignore errors
    }
}

// Initialize
displayWord();
checkIfSaved();

// Check saved status when changing words
const originalDisplayWord = displayWord;
displayWord = function() {
    originalDisplayWord.call(this);
    checkIfSaved();
};
</script>
