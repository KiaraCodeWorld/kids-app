{% extends 'trainer/base.html' %}

{% block content %}
<section class="settings-wrapper">
    <div class="settings-header">
        <h2>🌈 Comfort Settings</h2>
        <p>Make Brain Quest feel just right for you.</p>
    </div>

    <form method="post" class="settings-form">
        {% csrf_token %}

        <label class="setting-row">
            <span class="setting-info">
                <strong>🛑 Reduce Motion</strong>
                <small>Turn off bouncy mascots, confetti, and big animations.</small>
            </span>
            <span class="toggle">
                <input type="checkbox" name="reduce_motion" {% if player.reduce_motion %}checked{% endif %}>
                <span class="toggle-slider"></span>
            </span>
        </label>

        <label class="setting-row">
            <span class="setting-info">
                <strong>🔠 Larger Text</strong>
                <small>Make words a little bigger and easier to read.</small>
            </span>
            <span class="toggle">
                <input type="checkbox" name="large_text" {% if player.large_text %}checked{% endif %}>
                <span class="toggle-slider"></span>
            </span>
        </label>

        <label class="setting-row">
            <span class="setting-info">
                <strong>🎯 High Contrast</strong>
                <small>Stronger colors and clearer edges.</small>
            </span>
            <span class="toggle">
                <input type="checkbox" name="high_contrast" {% if player.high_contrast %}checked{% endif %}>
                <span class="toggle-slider"></span>
            </span>
        </label>

        <label class="setting-row">
            <span class="setting-info">
                <strong>📖 Dyslexia-Friendly Font</strong>
                <small>Use a font designed to help reading flow.</small>
            </span>
            <span class="toggle">
                <input type="checkbox" name="dyslexia_font" {% if player.dyslexia_font %}checked{% endif %}>
                <span class="toggle-slider"></span>
            </span>
        </label>

        <button type="submit" class="button save-settings-btn">💾 Save Settings</button>
    </form>

    <a href="{% url 'trainer:profile_me' %}" class="back-link">← Back to My Profile</a>
</section>

<style>
.settings-wrapper {
    max-width: 640px;
    margin: 0 auto;
    background: white;
    border-radius: 1.5rem;
    padding: 1.75rem;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
    animation: fadeIn 0.5s ease-out;
}
.settings-header { margin-bottom: 1.5rem; }
.settings-header h2 { margin: 0 0 0.25rem; font-size: 1.7rem; color: var(--purple, #7c5cff); }
.settings-header p { margin: 0; color: #64748b; }

.settings-form { display: flex; flex-direction: column; gap: 1rem; }
.setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 1rem; background: #f8fafc; border-radius: 1rem;
    border: 2px solid #e2e8f0; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
}
.setting-row:hover { border-color: #c4b5fd; background: #f5f3ff; }
.setting-info { display: flex; flex-direction: column; gap: 0.15rem; }
.setting-info strong { color: #1e293b; font-size: 1rem; }
.setting-info small { color: #64748b; font-size: 0.8rem; }

.toggle { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
    position: absolute; inset: 0;
    background: #cbd5e1; border-radius: 999px;
    transition: background 0.25s;
}
.toggle-slider::before {
    content: ''; position: absolute; left: 3px; top: 3px;
    width: 24px; height: 24px; background: white; border-radius: 50%;
    transition: transform 0.25s; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}
.toggle input:checked + .toggle-slider { background: #7c5cff; }
.toggle input:checked + .toggle-slider::before { transform: translateX(22px); }

.save-settings-btn {
    margin-top: 0.5rem; width: 100%; font-size: 1.05rem; font-weight: 800;
    padding: 0.9rem; border: none; border-radius: 1rem;
    background: linear-gradient(135deg, #7c5cff, #a855f7); color: white;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.save-settings-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,92,255,0.35); }

.back-link {
    display: inline-block; margin-top: 1.25rem;
    color: #7c5cff; text-decoration: none; font-weight: 700;
}
.back-link:hover { text-decoration: underline; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
{% endblock %}
